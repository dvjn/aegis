# Scan request bodies for secrets. "observe" records what it finds and
# forwards the body unchanged; "mask" sends a placeholder to the provider and
# restores the real value in the response.
# [guardrails]
# enabled = false
# mode = "observe"

# Each guardrail is turned on by itself. Omit detectors to run all of them.
# [guardrails.secrets]
# enabled = true
# detectors = [
#   "anthropic_api_key", "openai_api_key", "github_token", "gitlab_token",
#   "aws_access_key_id", "slack_token", "google_api_key", "stripe_key",
#   "npm_token", "jwt", "pem_private_key", "aegis_api_key",
# ]

# Your own patterns, masked like secrets. Name each one in lowercase snake_case
# and keep the names apart from the built-in detectors above.
# [guardrails.regex]
# enabled = true
# [guardrails.regex.detectors]
# internal_token = '\bint_[a-z0-9]{32}\b'
# employee_id = '\bEMP-\d{6}\b'

# Add entries to name accounts or configure additional accounts.
[[providers]]
id = "claude-personal"
type = "claude_subscription"

[[providers]]
id = "codex-personal"
type = "codex_subscription"
