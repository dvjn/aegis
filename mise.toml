[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy" }
zig = "0.16.0"
"github:rustsec/rustsec" = { version = "cargo-audit/v0.22.2" }
"github:rust-cross/cargo-zigbuild" = { version = "0.24.0" }
"github:nextest-rs/nextest" = { version = "cargo-nextest-0.9.143" }
watchexec = "2.8.0"
jq = "1.8.2"

[env]
TARGETS = "{{ env.BUILD_TARGETS | default(value='x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64') }}"

[tasks.local-bootstrap]
description = "Create the standard local account and API key when absent"
env = { AEGIS_CONFIG = "config.local.toml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p data
chmod 700 data
fresh_database=false
if [[ ! -e data/dev.db ]]; then
  fresh_database=true
fi
if [[ "$fresh_database" == true || ! -s data/api-key ]]; then
  if [[ "$fresh_database" == true ]]; then
    rm -f data/user-id data/api-key
  fi
if [[ ! -s data/api-key ]]; then
  if [[ ! -s data/user-id ]]; then
    bootstrap_output="$(printf 'Correct passw0rd!\n' | cargo run --quiet -- bootstrap-user \
      --email admin@example.com \
      --password-file /dev/stdin)"
    user_id="$(sed -n 's/.*created user: \([0-9a-f-]*\).*/\1/p' <<<"$bootstrap_output" | tail -1)"
    test -n "$user_id" || { printf '%s\n' "$bootstrap_output" >&2; exit 1; }
    (umask 077; printf '%s\n' "$user_id" > data/user-id)
  fi
  key_output="$(cargo run --quiet -- key create \
    --user "$(tr -d '\r\n' < data/user-id)" \
    --name mise \
    --provider claude \
    --provider codex \
    --provider typesafe)"
  api_key="$(sed -n 's/^key: //p' <<<"$key_output")"
  test -n "$api_key" || { printf '%s\n' "$key_output" >&2; exit 1; }
  (umask 077; printf '%s\n' "$api_key" > data/api-key)
fi
fi
printf 'Local server: %s\nEmail: admin@example.com\nPassword: Correct passw0rd!\nAPI key file: data/api-key\n' "${PUBLIC_URL:-http://127.0.0.1:8765}"
'''

[tasks.dev]
description = "Run the local server with live reload"
depends = ["local-bootstrap"]
env = { AEGIS_CONFIG = "config.local.toml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec watchexec --restart --watch src --watch Cargo.toml --watch Cargo.lock --exts rs,toml,css,ts,sh -- mise run dev:serve
'''

[tasks."dev:serve"]
description = "Build both binaries and run the development server"
hide = true
env = { AEGIS_CONFIG = "config.local.toml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --quiet --bin ags
mise run relay:stage
exec cargo run --bin aegis -- serve
'''

[tasks."relay:build"]
description = "Build the current AGS relay"
hide = true
run = "cargo build --quiet --bin ags"

[tasks."relay:stage"]
description = "Build and stage the host's downloadable ags binary"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
case "$(uname -s):$(uname -m)" in
  Linux:x86_64) target=x86_64-unknown-linux-musl ;;
  Linux:aarch64|Linux:arm64) target=aarch64-unknown-linux-musl ;;
  *) echo "Downloadable ags builds currently support Linux x86_64 and ARM64." >&2; exit 1 ;;
esac
if ! rustup target list --installed | grep -Fxq "$target"; then
  rustup target add "$target"
fi
cargo zigbuild --locked --bin ags --target "$target"
destination="${AEGIS_RELAY_DIR:-$PWD/dist/relay}/$target"
mkdir -p "$destination"
staged="$(mktemp "$destination/.ags.XXXXXX")"
trap 'rm -f "$staged"' EXIT
install -m755 "${CARGO_TARGET_DIR:-target}/$target/debug/ags" "$staged"
mv -f "$staged" "$destination/ags"
'''

[tasks.ags]
description = "Run AGS with workspace-local state and the current source build"
depends = ["relay:build"]
env = { AGS_HOME = "{{config_root}}/data/ags" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
export AGS_SERVER_URL="${AGS_SERVER_URL:-${PUBLIC_URL:-${AEGIS_DEV_URL:-http://127.0.0.1:8765}}}"
exec "${CARGO_TARGET_DIR:-target}/debug/ags" "$@"
'''

[tasks."relay:setup"]
description = "Pair the workspace relay and choose providers without installing shell wrappers"
depends = ["relay:build"]
env = { AGS_HOME = "{{config_root}}/data/ags" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
server="${PUBLIC_URL:-${AEGIS_DEV_URL:-http://127.0.0.1:8765}}"
curl --fail --silent --show-error --connect-timeout 3 --max-time 10 "$server/healthz" >/dev/null || {
  echo "Start the server in another terminal with: mise run dev" >&2
  exit 1
}
exec "${CARGO_TARGET_DIR:-target}/debug/ags" setup "$server" --no-wrappers "$@"
'''

[tasks.relay]
description = "Run a CLI through the workspace relay, with first-use setup when needed"
depends = ["relay:build"]
env = { AGS_HOME = "{{config_root}}/data/ags" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
test $# -gt 0 || { echo "usage: mise run relay -- <claude|codex|pi|agy> [CLI arguments...]" >&2; exit 2; }
client="$1"
shift
case "$client" in
  claude|codex|pi|agy) ;;
  *) echo "unsupported CLI: $client (supported: claude, codex, pi, agy)" >&2; exit 2 ;;
esac
server="${PUBLIC_URL:-${AEGIS_DEV_URL:-http://127.0.0.1:8765}}"
curl --fail --silent --show-error --connect-timeout 3 --max-time 10 "$server/healthz" >/dev/null || {
  echo "Start the server in another terminal with: mise run dev" >&2
  exit 1
}
ags="${CARGO_TARGET_DIR:-target}/debug/ags"
if [[ -s "$AGS_HOME/connection.json" ]] && [[ "$(jq -r '.server' "$AGS_HOME/connection.json")" != "${server%/}" ]]; then
  echo "The workspace relay is paired to a different server. Run mise run ags -- disconnect, then mise run relay:setup." >&2
  exit 1
fi
export AGS_SERVER_URL="$server"
exec "$ags" run "$client" -- "$@"
'''

[tasks.serve]
description = "Run the local server once, without live reload"
depends = ["local-bootstrap"]
env = { AEGIS_CONFIG = "config.local.toml" }
run = "cargo run -- serve"

[tasks.health]
description = "Check the local Aegis server"
run = '''curl --fail --silent --show-error "http://127.0.0.1:8765/healthz" && echo'''

[tasks.claude]
description = "Run Claude Code through local Aegis"
run = '''
test -s data/api-key || { echo "Run 'mise run serve' or 'mise run dev' once to create data/api-key" >&2; exit 1; }
export ANTHROPIC_BASE_URL='http://127.0.0.1:8765/providers/claude'
export ANTHROPIC_CUSTOM_HEADERS="x-aegis-api-key: $(tr -d '\r\n' < data/api-key)"
export CLAUDE_CODE_ENABLE_FINE_GRAINED_TOOL_STREAMING=1
exec claude "$@"
'''

[tasks.codex]
description = "Run Codex through local Aegis"
run = '''
test -s data/api-key || { echo "Run 'mise run serve' or 'mise run dev' once to create data/api-key" >&2; exit 1; }
export AEGIS_API_KEY="$(tr -d '\r\n' < data/api-key)"
exec codex \
  --config model_provider='"aegis"' \
  --config model_providers.aegis.name='"Aegis"' \
  --config model_providers.aegis.base_url='"http://127.0.0.1:8765/providers/codex"' \
  --config model_providers.aegis.wire_api='"responses"' \
  --config model_providers.aegis.requires_openai_auth=true \
  --config 'model_providers.aegis.env_http_headers={ "x-aegis-api-key" = "AEGIS_API_KEY" }' \
  "$@"
'''

[tasks.typesafe]
description = "Run a command against TypeSafe through local Aegis"
run = '''
#!/usr/bin/env bash
set -euo pipefail
test $# -gt 0 || { echo "usage: mise run typesafe -- <command> [args...]" >&2; exit 2; }
test -s data/api-key || { echo "Run 'mise run serve' or 'mise run dev' once to create data/api-key" >&2; exit 1; }
export AEGIS_API_KEY="$(tr -d '\r\n' < data/api-key)"
export TYPESAFE_BASE_URL="http://127.0.0.1:8765/providers/typesafe"
exec "$@"
'''

[tasks.pi]
description = "Run pi through local Aegis"
run = '''
#!/usr/bin/env bash
set -euo pipefail
test -s data/api-key || { echo "Run 'mise run serve' or 'mise run dev' once to create data/api-key" >&2; exit 1; }
export AEGIS_API_KEY="$(tr -d '\r\n' < data/api-key)"

real_agent_dir="${PI_REAL_AGENT_DIR:-$HOME/.pi/agent}"
agent_dir="$PWD/data/pi-agent"
rm -rf "$agent_dir"
mkdir -p "$agent_dir"
chmod 700 "$agent_dir"
if [[ -d "$real_agent_dir" ]]; then
  find "$real_agent_dir" -mindepth 1 -maxdepth 1 \
    ! -name models.json ! -name settings.json ! -name '*.lock' \
    -exec ln -s {} "$agent_dir/" \;
fi

settings_source="$real_agent_dir/settings.json"
test -s "$settings_source" || settings_source=/dev/null
jq -s '(.[0] // {}) + {transport: "sse"}' "$settings_source" > "$agent_dir/settings.json"

cat > "$agent_dir/models.json" <<'JSON'
{
  "providers": {
    "openai-codex": {
      "baseUrl": "http://127.0.0.1:8765/providers/codex",
      "headers": { "x-aegis-api-key": "$AEGIS_API_KEY" }
    }
  }
}
JSON

export PI_CODING_AGENT_DIR="$agent_dir"
exec pi "$@"
'''

[tasks."pricing:update"]
description = "Refresh the vendored LiteLLM model price map"
run = '''
#!/usr/bin/env bash
set -euo pipefail
url="${LITELLM_MODEL_COST_MAP_URL:-https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json}"
upstream="$(mktemp)"
trap 'rm -f "$upstream" "$upstream.filtered"' EXIT
curl --fail --silent --show-error --location --output "$upstream" "$url"

jq -S '
  to_entries
  | map(select(
      (.value | type == "object")
      and (.value.litellm_provider == "anthropic"
           or .value.litellm_provider == "openai"
           or .value.litellm_provider == "gemini"
           or .value.litellm_provider == "typesafe")
      and (.value.input_cost_per_token != null)
    ))
  | map({
      key: (if .value.litellm_provider == "typesafe" or .value.litellm_provider == "gemini"
            then (.key | sub("^(typesafe|gemini)/"; "")) else .key end),
      value: (
        { input: .value.input_cost_per_token,
          output: (.value.output_cost_per_token // 0) }
        + (if .value.cache_read_input_token_cost == null then {}
           else { cache_read: .value.cache_read_input_token_cost } end)
        + (if .value.cache_creation_input_token_cost == null then {}
           else { cache_write: .value.cache_creation_input_token_cost } end)
      )
    })
  | from_entries
' "$upstream" > "$upstream.filtered"

if [[ ! -s "$upstream.filtered" ]] || [[ "$(jq length "$upstream.filtered")" -eq 0 ]]; then
  echo "Refusing to vendor an empty price map." >&2
  exit 1
fi
mv "$upstream.filtered" src/pricing/model_prices.json

commit="$(curl --fail --silent --show-error --location \
  "https://api.github.com/repos/BerriAI/litellm/commits/main?path=model_prices_and_context_window.json" | jq -r .sha)"
sed -i \
  -e "s|^Upstream commit: .*|Upstream commit: $commit|" \
  -e "s|^Upstream sha256: .*|Upstream sha256: $(sha256sum "$upstream" | cut -d" " -f1)|" \
  -e "s|^Retrieved:       .*|Retrieved:       $(date -u +%Y-%m-%d)|" \
  src/pricing/LICENSE

printf 'Priced models: %s\n' "$(jq length src/pricing/model_prices.json)"
'''

[tasks.test]
description = "Run every test"
run = "cargo nextest run"

[tasks."test:unit"]
description = "Run the in-crate unit tests"
run = "cargo nextest run --bins"

[tasks."test:integration"]
description = "Run the black-box integration suite"
run = "cargo nextest run --test integration"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.lint]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.audit]
description = "Check dependencies for known vulnerabilities"
run = """
#!/usr/bin/env bash
set -euo pipefail
cargo audit
# An ignored advisory in .cargo/audit.toml is only safe while the crate stays
# out of the resolved graph. Fail when it comes back.
tree="$(cargo tree --target all --prefix none --format '{p}')"
if grep -Eq '^rkyv v0\\.7\\.46($|[[:space:]])' <<<"$tree"; then
  echo "error: rkyv 0.7.46 is in the dependency graph, so RUSTSEC-2026-0235 is no longer unreachable" >&2
  exit 1
fi
"""

[tasks.check]
depends = ["fmt-check", "lint", "test", "audit"]

[tasks."test:load:steady"]
description = "Compare steady-state load between two Aegis binaries"
run = 'mise run test:load:_run -- steady "$@"'

[tasks."test:load:scale"]
description = "Compare scaling load between two Aegis binaries"
run = 'mise run test:load:_run -- scale "$@"'

[tasks."test:load:soak"]
description = "Compare sustained load between two Aegis binaries"
run = 'mise run test:load:_run -- soak "$@"'

[tasks."test:load:resilience"]
description = "Compare resilience load between two Aegis binaries"
run = 'mise run test:load:_run -- resilience "$@"'

[tasks."test:load:all"]
description = "Compare every public load suite between two Aegis binaries"
run = 'mise run test:load:_run -- all "$@"'

[tasks."test:load:_run"]
description = "Run one or more load suites with explicit comparison binaries"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
suite="${1:-}"
if [[ -n "$suite" ]]; then
  shift
fi
if [[ "$suite" != steady && "$suite" != scale && "$suite" != soak && "$suite" != resilience && "$suite" != all ]]; then
  echo "unknown load suite: ${suite:-<none>}" >&2
  exit 2
fi
if [[ $# -ne 3 ]]; then
  echo "usage: mise run test:load:$suite -- <baseline-binary> <candidate-binary> <output-directory>" >&2
  exit 2
fi

baseline="$1"
candidate="$2"
output="$3"
harness="${AEGIS_LOAD_HARNESS:-}"
if [[ -z "$harness" ]]; then
  harness_target="${AEGIS_LOAD_HARNESS_TARGET_DIR:-$PWD/target/load-harness}"
  harness="$(
    CARGO_TARGET_DIR="$harness_target" \
      cargo test --locked --release --test load --no-run --message-format=json 2>/dev/null \
      | jq -r 'select(.executable != null and .target.name == "load") | .executable' \
      | tail -1
  )"
fi
test -n "$harness" && test -x "$harness" || {
  echo "load harness is not executable: ${harness:-<not found>}" >&2
  exit 1
}

arguments=(
  --baseline "$baseline"
  --candidate "$candidate"
  --output "$output"
)
if [[ "$suite" == all ]]; then
  arguments+=(--suite steady --suite scale --suite soak --suite resilience)
else
  arguments+=(--suite "$suite")
fi
exec "$harness" "${arguments[@]}"
'''

[tasks."test:load:_ci"]
description = "Build and compare revisions selected by the load workflow"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -ne 2 ]]; then
  echo "usage: mise run test:load:_ci -- <baseline-directory> <output-directory>" >&2
  exit 2
fi

baseline_dir="$1"
output="$2"
suites=()
case "${LOAD_EVENT:-}" in
  pull_request)
    labels="${LOAD_LABELS:-[]}" 
    if jq -e 'index("load:all") != null' <<<"$labels" >/dev/null; then
      suites=(steady scale soak resilience)
    else
      for suite in steady scale soak resilience; do
        if jq -e --arg label "load:$suite" 'index($label) != null' <<<"$labels" >/dev/null; then
          suites+=("$suite")
        fi
      done
    fi
    ;;
  push)
    suites=(steady)
    ;;
  schedule)
    suites=(steady scale soak resilience)
    ;;
  workflow_dispatch)
    requested="${LOAD_SUITE:-all}"
    if [[ "$requested" == all ]]; then
      suites=(steady scale soak resilience)
    else
      suites=("$requested")
    fi
    ;;
  *)
    echo "unsupported load event: ${LOAD_EVENT:-<none>}" >&2
    exit 2
    ;;
esac
if [[ -z "${suites[*]:-}" ]]; then
  echo "no load suite selected" >&2
  exit 2
fi

baseline_target="$PWD/target/load-baseline"
candidate_target="$PWD/target/load-candidate"
harness_target="$PWD/target/load-harness"
CARGO_TARGET_DIR="$baseline_target" cargo build --locked --release --bin aegis \
  --manifest-path "$baseline_dir/Cargo.toml"
CARGO_TARGET_DIR="$candidate_target" cargo build --locked --release --bin aegis
harness="$(
  CARGO_TARGET_DIR="$harness_target" \
    cargo test --locked --release --test load --no-run --message-format=json 2>/dev/null \
    | jq -r 'select(.executable != null and .target.name == "load") | .executable' \
    | tail -1
)"
test -n "$harness" && test -x "$harness"

arguments=(
  --baseline "$baseline_target/release/aegis"
  --candidate "$candidate_target/release/aegis"
  --output "$output"
)
for suite in "${suites[@]}"; do
  arguments+=(--suite "$suite")
done
exec "$harness" "${arguments[@]}"
'''

[tasks.fmt-check]
run = "cargo fmt --all --check"

[tasks.build]
run = "cargo build --release"

[tasks.dist]
description = "Cross-compile the release binaries into dist/<arch>/aegis"
run = """
#!/usr/bin/env bash
set -euo pipefail
rm -rf dist
for entry in $TARGETS; do
  target="${entry%%:*}"
  arch="${entry##*:}"
  rustup target add "$target"
  cargo zigbuild --release --locked --bins --target "$target"
  install -Dm755 "target/$target/release/aegis" "dist/$arch/aegis"
  install -Dm755 "target/$target/release/ags" "dist/$arch/ags"
  install -Dm755 "target/$target/release/ags" "dist/relay/$target/ags"
done
"""
sources = ["src/**/*.rs", "src/**/*.sh", "src/**/*.ts", "build.rs", "Cargo.toml", "Cargo.lock"]

[tasks.package]
description = "Make the release tarballs and checksums from dist/"
depends = ["dist"]
run = """
#!/usr/bin/env bash
set -euo pipefail
version="${VERSION:-$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)}"
for entry in $TARGETS; do
  target="${entry%%:*}"
  arch="${entry##*:}"
  name="aegis-${version}-${target}"
  mkdir -p "dist/${name}"
  cp "dist/${arch}/aegis" "dist/${name}/aegis"
  cp "dist/${arch}/ags" "dist/${name}/ags"
  cp README.md "dist/${name}/"
  tar -czf "dist/${name}.tar.gz" -C dist "${name}"
  rm -rf "dist/${name}"
  (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

done
"""

[tasks.image]
description = "Build the container image for both architectures"
depends = ["dist"]
run = """
#!/usr/bin/env bash
set -euo pipefail
platforms=""
for entry in $TARGETS; do
  platforms="${platforms},linux/${entry##*:}"
done
podman build --platform "${platforms#,}" --manifest aegis:local .
"""
