[workspace]
members = ["crates/aegis", "crates/aegis-wire", "crates/ags"]
default-members = ["crates/aegis"]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aegis-wire = { path = "crates/aegis-wire" }
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
subtle = "2.6"
toml = "1.1.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
