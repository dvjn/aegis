[workspace]
members = ["crates/aegis", "crates/aegis-wire", "crates/ags"]
default-members = ["crates/aegis"]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aegis-wire = { path = "crates/aegis-wire" }
clap = { version = "4.6.6", features = ["derive"] }
toml = "1.1.4"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
