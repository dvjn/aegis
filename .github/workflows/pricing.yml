name: 💰 Model Prices

on:
  schedule:
    - cron: "14 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-model-prices
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.11.8

jobs:
  refresh:
    name: 💰 Refresh Model Prices
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Create App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 🧰 Install Tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}

      - name: 🔄 Refresh Prices
        run: mise run pricing:update

      - name: ✅ Test Pricing
        run: cargo nextest run pricing

      - name: 📝 Open or Update Pull Request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: automation/model-prices
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- src/pricing/model_prices.json; then
            echo "Model prices are current."
            exit 0
          fi

          bot="${APP_SLUG}[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)+${bot}@users.noreply.github.com"
          git fetch origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" || true
          git switch --create "$PR_BRANCH"
          git add src/pricing/LICENSE src/pricing/model_prices.json
          git commit --message "chore: refresh vendored model prices"
          git push --force-with-lease origin "$PR_BRANCH"

          if gh pr list --head "$PR_BRANCH" --state open --json number --jq 'length' | grep -qx 0; then
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "chore: refresh vendored model prices" \
              --body $'Refresh the vendored LiteLLM pricing data.\n\nThe scheduled pricing workflow generated and tested this change.'
          fi
