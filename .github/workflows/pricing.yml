name: 💰 Model Prices

on:
  schedule:
    - cron: "14 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-model-prices
  cancel-in-progress: false

jobs:
  refresh:
    name: 💰 Refresh Model Prices
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: 🧰 Install Tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: 🔄 Refresh Prices
        run: mise run pricing:update

      - name: ✅ Test Pricing
        run: cargo test pricing

      - name: 📝 Open or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          PR_BRANCH: automation/model-prices
        run: |
          if git diff --quiet -- src/pricing/model_prices.json; then
            echo "Model prices are current."
            exit 0
          fi

          git config user.name "$(gh api user --jq 'if (.name // "") == "" then .login else .name end')"
          git config user.email "$(gh api user --jq 'if (.email // "") == "" then "\(.id)+\(.login)@users.noreply.github.com" else .email end')"
          git fetch origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" || true
          git switch --create "$PR_BRANCH"
          git add src/pricing/LICENSE src/pricing/model_prices.json
          git commit --message "chore: refresh vendored model prices"
          git push --force-with-lease origin "$PR_BRANCH"

          if gh pr list --head "$PR_BRANCH" --state open --json number --jq 'length' | grep -qx 0; then
            gh pr create \
              --base main \
              --head "$PR_BRANCH" \
              --title "chore: refresh vendored model prices" \
              --body $'Refresh the vendored LiteLLM pricing data.\n\nThe scheduled pricing workflow generated and tested this change.'
          fi
