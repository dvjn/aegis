name: 🏋️ Load

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Load suite
        type: choice
        options: [all, steady, scale, soak, resilience]
        default: all
      baseline:
        description: Baseline revision, defaults to the current revision for A/A calibration
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: load-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  load:
    name: 🏋️ Compare Load
    if: >-
      github.event_name != 'pull_request'
      || contains(toJSON(github.event.pull_request.labels.*.name), 'load:')
    runs-on: ubuntu-latest
    env:
      LOAD_EVENT: ${{ github.event_name }}
      LOAD_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      LOAD_SUITE: ${{ inputs.suite || '' }}
    steps:
      - name: 📥 Checkout Baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.before || inputs.baseline || github.sha }}
          path: baseline
          persist-credentials: false

      - name: 📥 Checkout Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: 🧰 Install Tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: candidate

      - name: 📦 Cache Rust Build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: candidate
          key: load

      - name: 🏋️ Run Load Comparison
        working-directory: candidate
        run: mise run test:load:_ci -- "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/load-results"

      - name: 📝 Summarize Load Comparison
        if: always()
        run: |
          if [[ -f load-results/summary.md ]]; then
            cat load-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The harness did not produce a summary.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ⬆️ Upload Load Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-${{ github.run_id }}-${{ github.run_attempt }}
          path: load-results
          if-no-files-found: warn
          retention-days: 14
