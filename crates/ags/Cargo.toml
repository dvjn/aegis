[package]
name = "ags"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ags"
path = "src/main.rs"

[dependencies]
aegis-wire = { workspace = true }
anyhow = "1.0.104"
clap = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
toml = { workspace = true }
